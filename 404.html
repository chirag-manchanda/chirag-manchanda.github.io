<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Chirag Manchanda</title>
<link rel="icon" href="/images/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Spectral:wght@400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#F6F7F5;color:#0F1418;font-family:'Spectral',Georgia,serif;
       display:grid;place-items:center;min-height:100vh;padding:2rem;line-height:1.6}
  .box{max-width:34rem}
  .code{font-family:'IBM Plex Mono',monospace;font-size:.66rem;font-weight:500;letter-spacing:.15em;
        text-transform:uppercase;color:#8A5F06;margin:0 0 1rem}
  h1{font-family:'Archivo',sans-serif;font-variation-settings:'wdth' 116,'wght' 620;
     font-size:clamp(1.9rem,5vw,2.9rem);letter-spacing:-.025em;line-height:1.05;margin:0 0 1rem}
  p{color:#5C6771;margin:0 0 1.6rem}
  a{display:inline-block;text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:.67rem;
    font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#F6F7F5;background:#123A47;
    padding:9px 13px;border-radius:2px}
  a:hover{background:#0F1418}
</style>
</head>
<body>
  <div class="box">
    <p class="code">Error 404</p>
    <h1>That page isn't here.</h1>
    <p>The link may be out of date. Everything now lives on a single page.</p>
    <a href="/">Go to the homepage</a>
  </div>
</body>
</html>
